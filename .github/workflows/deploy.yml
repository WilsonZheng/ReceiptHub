name: Deploy Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Build and deploy are separate jobs (the layout GitHub's own Pages starter uses). In a single job,
  # deploy-pages looked for the artifact right after it was uploaded and twice found none
  # ("No artifacts named github-pages were found", 2026-11-25) although the upload had succeeded.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 注意：Pages 站点需在仓库 Settings → Pages → Source: GitHub Actions 手动启用一次
      # （GITHUB_TOKEN 无 admin 权限，无法自动创建站点）
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
