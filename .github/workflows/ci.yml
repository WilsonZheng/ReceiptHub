name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04 in Nov 2026 and Playwright 1.60 has no browser build for it
    # ("Playwright does not support chromium on ubuntu26.04-x64"), so e2e silently stopped running.
    # Go back to ubuntu-latest once @playwright/test is on a version that supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx prettier --check src e2e scripts
      - run: npx vitest run
      - run: npx vite build # playwright 的 preview 服务器需要 dist/，必须先 build
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
